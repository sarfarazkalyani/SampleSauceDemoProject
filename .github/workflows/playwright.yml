name: Playwright Regression Pipeline
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npm test

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Send Webhook Alert Notification
      if: failure()
      run: |
        curl -X POST -H "Content-Type: application/json" \
        -d '{"text": "❌ Playwright automation pipeline failed on branch ${{ github.ref_name }}. Check execution artifacts."}' \
        ${{ secrets.SLACK_WEBHOOK_URL }} || echo "Skipping Slack execution alert configuration"
